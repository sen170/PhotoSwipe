<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留光 - 技术支持</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.8;
            padding: 20px;
        }
        .container { max-width: 640px; margin: 40px auto; }
        h1 { font-size: 28px; margin-bottom: 30px; color: #fff; }
        h2 { font-size: 18px; margin: 24px 0 12px; color: #fff; }
        p { margin-bottom: 12px; color: #b0b0b0; }
        a { color: #4a9eff; text-decoration: none; }
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .email { font-size: 16px; color: #4a9eff; }
        .version { color: #666; font-size: 14px; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>留光 技术支持</h1>

        <div class="card">
            <h2>联系我们</h2>
            <p>如有任何问题或建议，欢迎通过以下方式联系我们：</p>
            <p class="email">邮箱：asen170@163.com</p>
        </div>

        <div class="card">
            <h2>常见问题</h2>
            <p><strong>Q：删除的照片能恢复吗？</strong></p>
            <p>A：可以。删除的照片会进入系统「最近删除」相簿，30天内可恢复。</p>
            <br>
            <p><strong>Q：照片会被上传到服务器吗？</strong></p>
            <p>A：不会。所有操作仅在你的设备上完成，照片绝不上传或共享。</p>
            <br>
            <p><strong>Q：为什么需要相册权限？</strong></p>
            <p>A：留光需要访问相册才能浏览和整理你的照片，所有操作仅在本地完成。</p>
            <br>
            <p><strong>Q：稍后复看的照片去哪了？</strong></p>
            <p>A：右滑「稍后复看」的照片不会计入已整理，会在下次整理时重新出现。</p>
        </div>

        <p class="version">留光 版本 1.0 &copy; 2026</p>
    </div>
</body>
</html>
